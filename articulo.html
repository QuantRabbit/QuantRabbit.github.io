<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ensayo | Ensayos</title>
  <meta name="description" content="Ensayo sobre economía, política, inversión y vida económica.">
  <meta name="author" content="Autor">
  <meta name="robots" content="index, follow">

  <!-- Canónico y Open Graph gestionados dinamicamente por js/app.js -->
  <link rel="canonical" href="https://quantrabbit.github.io/articulo.html">
  <meta property="og:site_name" content="Ensayos">
  <meta property="og:title" content="Ensayo | Ensayos">
  <meta property="og:description" content="Canal personal de ensayos sobre economía, política e inversión.">
  <meta property="og:type" content="article">
  <meta property="og:locale" content="es_MX">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Ensayo | Ensayos">
  <meta name="twitter:description" content="Canal personal de ensayos sobre economía, política e inversión.">

  <!-- Prevencion de parpadeo de tema -->
  <script>
    (function() {
      var tema = localStorage.getItem('tema-preferido');
      if (tema) {
        document.documentElement.setAttribute('data-tema', tema);
      }
    })();
  </script>

  <!-- Estilos -->
  <link rel="stylesheet" href="css/estilos.css">

  <!-- Respaldo de datos y logica cliente -->
  <script src="datos/articulos.js"></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <div class="sitio-wrapper">
    <!-- Cabecera Editorial GBM Media -->
    <header class="gbm-header">
      <div class="contenedor">
        <div class="gbm-header__top">
          <a href="index.html" class="marca-editorial">
            <span class="marca-monograma">QR</span>
            <div class="marca-info">
              <span class="marca-nombre">ENSAYOS</span>
            </div>
          </a>

          <div class="gbm-header__acciones">
            <div class="header-fecha-bloque">
              <p class="header-fecha">13 DE OCTUBRE</p>
              <p class="header-subfecha">Canal editorial personal</p>
            </div>
            <button type="button" class="btn-tema" aria-label="Cambiar tema">
              <span>🌙</span><span>OSCURO</span>
            </button>
          </div>
        </div>

        <nav class="gbm-subnav" aria-label="Navegación editorial">
          <a href="index.html">Ensayos</a>
          <a href="sobre-mi.html">Sobre mí</a>
          <a href="rss.xml">RSS Feed</a>
          <a href="llms.txt">llms.txt</a>
          <a href="https://github.com/QuantRabbit" target="_blank" rel="noopener noreferrer">GitHub</a>
        </nav>
      </div>
    </header>

    <!-- Contenedor Principal de Lectura -->
    <main class="contenedor" id="contenedor-articulo">
      <noscript>
        <div class="columna-lectura" style="padding: 3rem 0;">
          <p>Este sitio utiliza JavaScript ligero para presentar los ensayos con formato interactivo. Si tu navegador no ejecuta scripts, puedes consultar directamente los datos en <a href="datos/articulos.json">datos/articulos.json</a> o suscribirte a <a href="rss.xml">rss.xml</a>.</p>
        </div>
      </noscript>
      <div class="columna-lectura" style="padding: 3.5rem 0; color: var(--muted);">
        Cargando ensayo...
      </div>
    </main>

    <!-- Pie de pagina editorial GBM Media -->
    <footer class="gbm-footer">
      <div class="contenedor">
        <div class="gbm-footer__inner">
          <p class="gbm-footer__copy">© 2026 Ensayos. Textos redactados a mano sin inteligencia artificial.</p>
          <div class="gbm-footer__links">
            <a href="index.html">Ensayos</a>
            <a href="sobre-mi.html">Sobre mí</a>
            <a href="llms.txt">llms.txt</a>
            <a href="rss.xml">RSS</a>
            <a href="sitemap.xml">Sitemap</a>
            <a href="https://github.com/QuantRabbit" target="_blank" rel="noopener noreferrer">GitHub</a>
          </div>
        </div>
      </div>
    </footer>
  </div>
</body>
</html>
